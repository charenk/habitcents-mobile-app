<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap');
    body { margin: 0; font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    a { color: #2C7851; } a:hover { color: #246242; }
  </style>
</helmet>

<div style="width: 390px; min-height: 844px; background: #F7F9FC; margin: 0 auto; padding-top: 20px; display: flex; flex-direction: column; color: #1A1D23; font-family: 'Inter', system-ui, sans-serif; position: relative; overflow: hidden;">

  <!-- Header -->
  <div style="display: flex; flex-direction: row; align-items: flex-start; justify-content: space-between; padding: 16px 20px 4px 20px;">
    <div style="flex: 1; display: flex; flex-direction: column;">
      <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 34px; line-height: 40px; color: #1A1D23;">Today.</div>
      <div style="margin-top: 2px; font-size: 11px; font-weight: 600; letter-spacing: 0.88px; color: #677481; text-transform: uppercase;">Friday, August 14</div>
    </div>
    <div style="display: flex; flex-direction: row; gap: 8px;">
      <div style="width: 40px; height: 40px; border-radius: 999px; background: #FFFFFF; border: 1px solid #E8EDF2; display: flex; align-items: center; justify-content: center;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#4A5568" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="10" r="3"/><path d="M7 20.662V19a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v1.662"/></svg>
      </div>
    </div>
  </div>

  <!-- Chips: Spent active -->
  <div style="padding: 0 20px; margin-top: 8px; margin-bottom: 12px;">
    <div style="display: flex; flex-direction: row; background: #E8EDF2; border-radius: 23px; padding: 3px; gap: 3px;">
      <div style="flex: 1; border-radius: 20px; padding: 12px 14px; background: #FFFFFF; box-shadow: 0 4px 8px rgba(26,29,35,0.04);">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.88px; text-transform: uppercase; color: #1A1D23;">Spent today</div>
        <div style="font-size: 22px; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-variant-numeric: tabular-nums; color: #1A1D23; margin-top: 6px;">$23.35</div>
      </div>
      <div style="flex: 1; border-radius: 20px; padding: 12px 14px;">
        <div style="display: flex; flex-direction: row; align-items: center; gap: 6px;">
          <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.88px; text-transform: uppercase; color: #4A5568;">Kept today</div>
          <div style="width: 6px; height: 6px; border-radius: 4px; background: #2C7851;"></div>
        </div>
        <div style="font-size: 22px; font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-variant-numeric: tabular-nums; color: #677481; margin-top: 6px;">$0.00</div>
      </div>
    </div>
  </div>

  <!-- Quick-log card -->
  <div style="padding: 0 20px;">
    <div style="background: #FFFFFF; border-radius: 14px; border: 1px solid #E8EDF2; padding: 14px 16px; display: flex; flex-direction: row; align-items: center; gap: 12px;">
      <div style="flex: 1; display: flex; flex-direction: row; align-items: baseline;">
        <span style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 20px; color: #8898AA; margin-right: 2px;">$</span>
        <span style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 26px; font-variant-numeric: tabular-nums; color: #8898AA;">0.00</span>
      </div>
      <div style="width: 52px; height: 52px; border-radius: 14px; background: #2C7851; display: flex; align-items: center; justify-content: center;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      </div>
    </div>
  </div>

  <!-- Centered quote + hook -->
  <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 32px; gap: 40px;">
    <div style="font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-style: italic; font-size: 20px; line-height: 28px; color: #4A5568; text-align: center;">Every big savings goal starts with a single small step</div>
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#1A1D23" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v16a2 2 0 0 0 2 2h16"/><path d="m19 9-5 5-4-4-3 3"/></svg>
      <div style="font-size: 17px; font-weight: 600; color: #1A1D23; text-align: center;">Hook title for Money &gt; Spent</div>
      <div style="font-size: 14px; color: #677481; text-align: center; line-height: 20px;">Short description as needed (optional)</div>
      <div style="margin-top: 8px; width: 200px; min-height: 44px; border-radius: 10px; background: #FFFFFF; border: 1px solid #E8EDF2; display: flex; align-items: center; justify-content: center;">
        <span style="font-size: 15px; font-weight: 600; color: #1A1D23;">CTA</span>
      </div>
    </div>
  </div>

  <!-- Tab bar (Today active) -->
  <div style="background: #FFFFFF; border-top: 1px solid #E8EDF2; padding-top: 8px; padding-bottom: 20px; display: flex; flex-direction: row;">
    <div style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #2C7851;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #2C7851;">Today</span>
    </div>
    <div style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #677481;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #677481;">Money</span>
    </div>
    <div style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #677481;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16 7h6v6"/><path d="m22 7-8.5 8.5-5-5L2 17"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #677481;">Insights</span>
    </div>
    <div style="flex: 1; min-height: 44px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #677481;">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="7" x="3" y="3" rx="1"/><rect width="7" height="7" x="14" y="3" rx="1"/><rect width="7" height="7" x="14" y="14" rx="1"/><rect width="7" height="7" x="3" y="14" rx="1"/></svg>
      <span style="font-size: 11px; font-weight: 600; color: #677481;">Categories</span>
    </div>
  </div>

</div>
</x-dc>
</body>
</html>
